services:
  catalog.api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=catalog.db;Database=catalogdb;Username=postgres;Password=postgres
      - RabbitMq__Host=rabbitmq
      # JWT (Keycloak): keys are fetched inside the Docker network, tokens are issued for localhost:8080
      - JwtAuth__Authority=http://keycloak:8080/realms/medstorage
      - JwtAuth__ValidIssuer=http://localhost:8080/realms/medstorage
      - JwtAuth__Audience=medstorage-catalog-api
    depends_on:
      catalog.db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog.db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalogdb
    ports:
      - "5435:5432" # 5432 is taken by the local Windows PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 20s # the diagnostics CLI boots an Erlang VM per call and can take >5s
      start_period: 60s
      retries: 10
