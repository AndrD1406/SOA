events {}

http {
    # Docker's embedded DNS; re-resolve so scaled-up replicas get traffic too
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream inventory_api {
        zone inventory_api 64k;
        # Round-robins across every container behind the "inventory.api" DNS name
        server inventory.api:8080 resolve;
    }

    upstream user_api {
        zone user_api 64k;
        server user.api:8080 resolve;
    }

    server {
        listen 80;

        # User Service (JWT-protected). CORS (incl. preflight OPTIONS) is handled by the
        # service itself, so the gateway only passes requests and headers through unchanged.
        location /api/v1/user/ {
            proxy_pass http://user_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization; # bearer token for JWT validation
        }

        location / {
            proxy_pass http://inventory_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Shows which replica handled the request
            add_header X-Upstream $upstream_addr always;
        }
    }
}
