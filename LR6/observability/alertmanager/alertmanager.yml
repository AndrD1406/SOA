# Alertmanager: groups alerts from Prometheus and forwards them to the n8n incident-response workflow.
# n8n production webhook URL = http://n8n:5678/webhook/<path of the Webhook node>; the workflow must be active.

route:
  receiver: n8n-incident-response
  # One notification (and one incident ticket per alert) per service and problem type
  group_by: [alertname, service]
  group_wait: 30s       # wait to batch alerts that start together
  group_interval: 5m    # how often to notify about new alerts in an existing group
  repeat_interval: 4h   # re-notify about a still-firing alert

receivers:
  - name: n8n-incident-response
    webhook_configs:
      - url: http://n8n:5678/webhook/alertmanager
        send_resolved: true # n8n closes the ticket when the alert resolves
        max_alerts: 20

inhibit_rules:
  # While a service is down, its latency / error-rate alerts are just symptoms
  - source_matchers: [alertname = ServiceDown]
    target_matchers: [alertname =~ "HighLatency|HighErrorRate"]
    equal: [service]
