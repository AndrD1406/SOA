# Observability & AIOps stack for MedStorage (included by the root docker-compose.yml).
#   Prometheus:   http://localhost:9090         (targets: /targets, alerts: /alerts)
#   Alertmanager: http://localhost:9093
#   Grafana:      http://localhost:3001         (admin/admin) -> dashboard "MedStorage / Service Overview"
#   Jaeger UI:    http://localhost:16686        (OTLP gRPC :4317, OTLP HTTP :4318)
#   n8n:          http://localhost:5678         (incident-response workflow, see observability/README.md)
# Grafana is on 3001 because 3000 is the MedStorage web client origin allowed by the User Service CORS policy.

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle # POST /-/reload re-reads prometheus.yml and the rules without a restart
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  # Jaeger v2 all-in-one: OTLP receiver + in-memory trace storage + UI (traces are lost on restart)
  # Pinned to 2.20.0: Jaeger 2.21+ removed the legacy /api/services, /api/traces HTTP API that the
  # Grafana Jaeger data source still uses (Grafana 13.2 shows "request failed: 404 Not Found").
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    environment:
      # Listen on all interfaces so other containers can reach OTLP (the collector default may be localhost)
      - JAEGER_LISTEN_HOST=0.0.0.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC (used by the .NET services)
      - "4318:4318"   # OTLP HTTP

  grafana:
    image: grafana/grafana:13.2.6
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      # Data sources (Prometheus, Jaeger) and the dashboard are provisioned on startup
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

  # Automated incident response: Alertmanager -> webhook -> n8n workflow (ticket + notification)
  n8n:
    image: n8nio/n8n:2.48.4
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Kyiv
      - TZ=Europe/Kyiv
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false # UI is served over plain HTTP on localhost
      - N8N_DIAGNOSTICS_ENABLED=false
      # The workflow reads SLACK_WEBHOOK_URL / GRAFANA_URL / JAEGER_URL through $env
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GRAFANA_URL=http://localhost:3001
      - JAEGER_URL=http://localhost:16686
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  n8n_data:
