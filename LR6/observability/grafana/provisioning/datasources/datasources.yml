apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus # referenced by the provisioned dashboard
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s # = scrape_interval, so $__rate_interval is never shorter than 4 scrapes

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
