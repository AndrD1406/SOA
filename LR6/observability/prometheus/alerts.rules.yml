# Alerting rules for the MedStorage microservices.
# Metric names come from the OpenTelemetry Prometheus exporter in each service:
#   http_server_request_duration_seconds_{bucket,count,sum}  (ASP.NET Core, histogram in seconds)
#   up                                                        (Prometheus: 1 = last scrape succeeded)
# Every alert carries labels "service" (= Prometheus job) and "severity"; n8n uses both.

groups:
  - name: medstorage-availability
    rules:
      # A target that is still in Docker DNS but does not answer /metrics (crashed, hung, port closed)
      - alert: ServiceDown
        expr: up{job=~"catalog-api|inventory-api|alerts-api|user-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
          problem: service_down
        annotations:
          summary: "{{ $labels.job }} is down ({{ $labels.instance }})"
          description: "Prometheus has failed to scrape {{ $labels.job }} at {{ $labels.instance }} for more than 1 minute."

      # A stopped/removed container disappears from Docker DNS, so there is no target left to report up == 0.
      # absent() keeps the job label from the equality matcher, so the alert still names the service.
      - alert: ServiceDown
        expr: |
          absent(up{job="catalog-api"})
            or absent(up{job="inventory-api"})
            or absent(up{job="alerts-api"})
            or absent(up{job="user-api"})
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
          problem: service_down
        annotations:
          summary: "{{ $labels.job }} has no running instances"
          description: "No {{ $labels.job }} container has been resolvable via Docker DNS for more than 1 minute."

  - name: medstorage-golden-signals
    rules:
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (job, le) (rate(http_server_request_duration_seconds_bucket{job=~".*-api"}[5m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
          problem: high_latency
        annotations:
          summary: "High p99 latency on {{ $labels.job }}"
          description: "p99 HTTP latency of {{ $labels.job }} is {{ $value | humanizeDuration }} (threshold 500ms) over the last 5 minutes."

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{job=~".*-api", http_response_status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count{job=~".*-api"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
          problem: high_error_rate
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.job }}"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.job }} returned 5xx over the last 5 minutes (threshold 5%)."
